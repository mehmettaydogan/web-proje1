<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEAR RUNNER – Makine Koşusu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="game-wrapper">
  <div id="hud">
    <div id="title-hud">⚙️ GEAR RUNNER</div>
    <div class="hud-stat">SKOR: <span id="score-display">0</span></div>
    <div class="hud-stat">EN YÜKSEK: <span id="high-display">0</span></div>
    <div class="hud-stat">CAN: <span id="life-display">♥️♥️♥️</span></div>
  </div>
  <canvas id="gameCanvas" width="800" height="380"></canvas>
  <div id="controls-bar">
    <span>[BOŞLUK]</span> veya <span>[↑]</span> → ZIPLa &nbsp;|&nbsp;
    <span>[↓]</span> → EĞİL &nbsp;|&nbsp;
    <span>[ENTER]</span> → BAŞLAT/YENİDEN
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
